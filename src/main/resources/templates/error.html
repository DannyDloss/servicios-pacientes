<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error | Clinica San Rafael</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="error-page">
<div class="error-card">
    <span class="error-code" th:text="${status ?: 'Error'}">Error</span>
    <h1>No se pudo completar la solicitud</h1>
    <p th:text="${message ?: 'Intente nuevamente o regrese al dashboard.'}">Error</p>
    <a th:href="@{/}" class="btn btn-primary">Volver al dashboard</a>
</div>
</body>
</html>
