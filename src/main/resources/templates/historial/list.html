<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::titulo}, ~{::section})}">
<head>
    <title th:fragment="titulo">Historial clinico</title>
</head>
<body>
<section>
    <div class="cabecera-pagina">
        <div>
            <h1>Historial clinico</h1>
            <p class="texto-gris">Atenciones, diagnosticos y tratamientos registrados.</p>
        </div>
        <div class="acciones">
            <a th:href="@{/historial/nuevo}" class="boton primario">Registrar atencion</a>
        </div>
    </div>

    <div class="tarjeta" th:if="${!#lists.isEmpty(historiales)}">
        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Paciente</th>
                    <th>Medico</th>
                    <th>Diagnostico</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="h : ${historiales}">
                    <td th:text="${h.fechaConsultaTexto}">Fecha</td>
                    <td th:text="${h.paciente.nombreCompleto}">Paciente</td>
                    <td th:text="${h.medico.nombreCompleto}">Medico</td>
                    <td th:text="${h.diagnosticoResumen}">Diagnostico</td>
                    <td class="celda-acciones">
                        <a th:href="@{/historial/{id}(id=${h.id})}" class="boton pequeno">Ver</a>
                        <a th:href="@{/historial/{id}/editar(id=${h.id})}" class="boton pequeno secundario">Editar</a>
                        <a th:href="@{/recetas/nueva(historialId=${h.id})}" class="boton pequeno primario">Receta</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="vacio" th:if="${#lists.isEmpty(historiales)}">
        <p>No hay atenciones registradas.</p>
        <a th:href="@{/historial/nuevo}" class="boton primario">Registrar primera atencion</a>
    </div>
</section>
</body>
</html>
