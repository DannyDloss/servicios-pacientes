<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::titulo}, ~{::section})}">
<head>
    <title th:fragment="titulo">Medicos</title>
</head>
<body>
<section>
    <div class="cabecera-pagina">
        <div>
            <h1>Medicos</h1>
            <p class="texto-gris">Lista de medicos registrados en la clinica.</p>
        </div>
        <div class="acciones">
            <a th:href="@{/medicos/nuevo}" class="boton primario">Nuevo medico</a>
        </div>
    </div>

    <div class="tarjeta" th:if="${!#lists.isEmpty(medicos)}">
        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                <tr>
                    <th>Colegiatura</th>
                    <th>Medico</th>
                    <th>Especialidad</th>
                    <th>Telefono</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${medicos}">
                    <td th:text="${m.colegiatura}">CMP</td>
                    <td th:text="${m.nombreCompleto}">Medico</td>
                    <td th:text="${m.especialidad}">Especialidad</td>
                    <td th:text="${m.telefono}">Telefono</td>
                    <td>
                        <span class="estado" th:text="${m.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                    </td>
                    <td class="celda-acciones">
                        <a th:href="@{/medicos/{id}/editar(id=${m.id})}" class="boton pequeno secundario">Editar</a>
                        <form th:action="@{/medicos/{id}/eliminar(id=${m.id})}" method="post" class="form-inline">
                            <button type="submit" class="boton pequeno peligro"
                                    onclick="return confirm('¿Eliminar este medico?')">Eliminar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="vacio" th:if="${#lists.isEmpty(medicos)}">
        <p>No hay medicos registrados.</p>
        <a th:href="@{/medicos/nuevo}" class="boton primario">Registrar primer medico</a>
    </div>
</section>
</body>
</html>
