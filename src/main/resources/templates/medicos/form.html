<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::titulo}, ~{::section})}">
<head>
    <title th:fragment="titulo">Medico</title>
</head>
<body>
<section>
    <div class="cabecera-pagina">
        <div>
            <h1 th:text="${modoEdicion} ? 'Editar medico' : 'Nuevo medico'">Medico</h1>
            <p class="texto-gris">Complete los datos del medico.</p>
        </div>
        <div class="acciones">
            <a th:href="@{/medicos}" class="boton">Volver</a>
        </div>
    </div>

    <form class="formulario"
          th:action="${modoEdicion} ? @{/medicos/{id}(id=${medico.id})} : @{/medicos}"
          th:object="${medico}" method="post">

        <div class="seccion-form">
            <h2>Datos profesionales</h2>
            <div class="fila">
                <div class="campo">
                    <label for="nombres">Nombres *</label>
                    <input type="text" id="nombres" th:field="*{nombres}" maxlength="80">
                    <p class="error" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></p>
                </div>
                <div class="campo">
                    <label for="apellidos">Apellidos *</label>
                    <input type="text" id="apellidos" th:field="*{apellidos}" maxlength="80">
                    <p class="error" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></p>
                </div>
                <div class="campo">
                    <label for="especialidad">Especialidad *</label>
                    <input type="text" id="especialidad" th:field="*{especialidad}" maxlength="80">
                    <p class="error" th:if="${#fields.hasErrors('especialidad')}" th:errors="*{especialidad}"></p>
                </div>
                <div class="campo">
                    <label for="colegiatura">Colegiatura *</label>
                    <input type="text" id="colegiatura" th:field="*{colegiatura}" maxlength="30">
                    <p class="error" th:if="${#fields.hasErrors('colegiatura')}" th:errors="*{colegiatura}"></p>
                </div>
                <div class="campo">
                    <label for="telefono">Telefono</label>
                    <input type="text" id="telefono" th:field="*{telefono}" maxlength="20">
                    <p class="error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></p>
                </div>
                <div class="campo">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" th:field="*{email}" maxlength="120">
                    <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>
                <div class="campo campo-completo">
                    <label for="horario">Horario de atencion</label>
                    <input type="text" id="horario" th:field="*{horario}" maxlength="120"
                           placeholder="Ej. Lunes a viernes de 8:00 a 14:00">
                    <p class="error" th:if="${#fields.hasErrors('horario')}" th:errors="*{horario}"></p>
                </div>
                <div class="campo campo-completo">
                    <label>
                        <input type="checkbox" th:field="*{activo}">
                        Medico activo para nuevas citas
                    </label>
                </div>
            </div>
        </div>

        <div class="acciones-form">
            <a th:href="@{/medicos}" class="boton">Cancelar</a>
            <button type="submit" class="boton primario"
                    th:text="${modoEdicion} ? 'Guardar cambios' : 'Registrar medico'">Guardar</button>
        </div>
    </form>
</section>
</body>
</html>
