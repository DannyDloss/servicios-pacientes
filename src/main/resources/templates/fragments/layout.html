<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(titulo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${titulo}">Clinica San Rafael</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="barra">
    <div class="contenedor barra-contenido">
        <a class="logo" th:href="@{/}">Clinica San Rafael</a>
        <nav class="menu">
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/pacientes}">Pacientes</a>
            <a th:href="@{/medicos}">Medicos</a>
            <a th:href="@{/citas}">Citas</a>
            <a th:href="@{/historial}">Historial</a>
            <a th:href="@{/recetas}">Recetas</a>
        </nav>
    </div>
</header>

<main class="contenedor contenido">
    <div class="mensaje" th:if="${exito}" th:text="${exito}"></div>
    <div class="mensaje error" th:if="${error}" th:text="${error}"></div>
    <div th:replace="${contenido}"></div>
</main>

<footer class="pie">
    <div class="contenedor">Sistema de gestion de clinica - Spring Boot y MySQL</div>
</footer>

</body>
</html>
