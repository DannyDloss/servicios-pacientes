<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::titulo}, ~{::section})}">
<head>
    <title th:fragment="titulo">Citas</title>
</head>
<body>
<section>
    <div class="cabecera-pagina">
        <div>
            <h1>Citas</h1>
            <p class="texto-gris">Lista de citas registradas en la clinica.</p>
        </div>
        <div class="acciones">
            <a th:href="@{/citas/nueva}" class="boton primario">Nueva cita</a>
        </div>
    </div>

    <div class="tarjeta" th:if="${!#lists.isEmpty(citas)}">
        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                <tr>
                    <th>Fecha y hora</th>
                    <th>Paciente</th>
                    <th>Medico</th>
                    <th>Motivo</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${citas}">
                    <td>
                        <a th:href="@{/citas/{id}(id=${c.id})}" th:text="${c.fechaHoraTexto}">Fecha</a>
                    </td>
                    <td th:text="${c.paciente.nombreCompleto}">Paciente</td>
                    <td th:text="${c.medico.nombreCompleto}">Medico</td>
                    <td th:text="${c.motivo}">Motivo</td>
                    <td><span class="estado" th:text="${c.estado.etiqueta}">Estado</span></td>
                    <td class="celda-acciones">
                        <a th:href="@{/citas/{id}(id=${c.id})}" class="boton pequeno">Ver</a>
                        <a th:href="@{/citas/{id}/editar(id=${c.id})}" class="boton pequeno secundario">Editar</a>
                        <a th:if="${c.estado.name() == 'PROGRAMADA'}"
                           th:href="@{/historial/nuevo(citaId=${c.id})}" class="boton pequeno primario">Atender</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="vacio" th:if="${#lists.isEmpty(citas)}">
        <p>No hay citas registradas.</p>
        <a th:href="@{/citas/nueva}" class="boton primario">Agendar primera cita</a>
    </div>
</section>
</body>
</html>
