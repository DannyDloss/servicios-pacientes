<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::titulo}, ~{::section})}">
<head>
    <title th:fragment="titulo">Recetas</title>
</head>
<body>
<section>
    <div class="cabecera-pagina">
        <div>
            <h1>Recetas medicas</h1>
            <p class="texto-gris">Recetas emitidas para los pacientes.</p>
        </div>
        <div class="acciones">
            <a th:href="@{/recetas/nueva}" class="boton primario">Nueva receta</a>
        </div>
    </div>

    <div class="tarjeta" th:if="${!#lists.isEmpty(recetas)}">
        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                <tr>
                    <th>Codigo</th>
                    <th>Fecha</th>
                    <th>Paciente</th>
                    <th>Medico</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${recetas}">
                    <td>
                        <a th:href="@{/recetas/{id}(id=${r.id})}" th:text="${r.codigo}">REC</a>
                    </td>
                    <td th:text="${r.fechaEmisionTexto}">Fecha</td>
                    <td th:text="${r.paciente.nombreCompleto}">Paciente</td>
                    <td th:text="${r.medico.nombreCompleto}">Medico</td>
                    <td><span class="estado" th:text="${r.estado.etiqueta}">Estado</span></td>
                    <td class="celda-acciones">
                        <a th:href="@{/recetas/{id}(id=${r.id})}" class="boton pequeno">Ver</a>
                        <form th:if="${r.estado.name() == 'EMITIDA'}"
                              th:action="@{/recetas/{id}/anular(id=${r.id})}" method="post" class="form-inline">
                            <button type="submit" class="boton pequeno peligro"
                                    onclick="return confirm('¿Anular esta receta?')">Anular</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="vacio" th:if="${#lists.isEmpty(recetas)}">
        <p>No hay recetas emitidas.</p>
        <a th:href="@{/recetas/nueva}" class="boton primario">Emitir primera receta</a>
    </div>
</section>
</body>
</html>
