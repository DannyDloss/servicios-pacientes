<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::titulo}, ~{::section})}">
<head>
    <title th:fragment="titulo">Pacientes</title>
</head>
<body>
<section>
    <div class="cabecera-pagina">
        <div>
            <h1>Pacientes</h1>
            <p class="texto-gris">Lista de pacientes registrados en la clinica.</p>
        </div>
        <div class="acciones">
            <a th:href="@{/pacientes/nuevo}" class="boton primario">Nuevo paciente</a>
        </div>
    </div>

    <div class="tarjeta" th:if="${!#lists.isEmpty(pacientes)}">
        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                <tr>
                    <th>Documento</th>
                    <th>Paciente</th>
                    <th>Edad</th>
                    <th>Telefono</th>
                    <th>Sangre</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pacientes}">
                    <td th:text="${p.documento}">Documento</td>
                    <td>
                        <a th:href="@{/pacientes/{id}(id=${p.id})}" th:text="${p.nombreCompleto}">Paciente</a>
                    </td>
                    <td th:text="${p.edad}">0</td>
                    <td th:text="${p.telefono}">Telefono</td>
                    <td th:text="${p.tipoSangre}">O+</td>
                    <td class="celda-acciones">
                        <a th:href="@{/pacientes/{id}(id=${p.id})}" class="boton pequeno">Ver</a>
                        <a th:href="@{/pacientes/{id}/editar(id=${p.id})}" class="boton pequeno secundario">Editar</a>
                        <form th:action="@{/pacientes/{id}/eliminar(id=${p.id})}" method="post" class="form-inline">
                            <button type="submit" class="boton pequeno peligro"
                                    onclick="return confirm('¿Eliminar este paciente?')">Eliminar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="vacio" th:if="${#lists.isEmpty(pacientes)}">
        <p>No hay pacientes registrados.</p>
        <a th:href="@{/pacientes/nuevo}" class="boton primario">Registrar primer paciente</a>
    </div>
</section>
</body>
</html>
