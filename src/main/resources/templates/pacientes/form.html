<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::titulo}, ~{::section})}">
<head>
    <title th:fragment="titulo">Paciente</title>
</head>
<body>
<section>
    <div class="page-header">
        <div>
            <h1 th:text="${modoEdicion} ? 'Editar paciente' : 'Nuevo paciente'">Paciente</h1>
            <p>Completa la informacion personal, de contacto y antecedentes medicos.</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/pacientes}" class="btn btn-ghost">Volver al listado</a>
        </div>
    </div>

    <form th:action="${modoEdicion} ? @{/pacientes/{id}(id=${paciente.id})} : @{/pacientes}"
          th:object="${paciente}" method="post" class="form-card">
        <div class="form-section">
            <h2>Datos personales</h2>
            <div class="form-grid">
                <div class="field">
                    <label for="nombres">Nombres *</label>
                    <input type="text" id="nombres" th:field="*{nombres}" maxlength="80" placeholder="Nombres completos">
                    <p class="field-error" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></p>
                </div>
                <div class="field">
                    <label for="apellidos">Apellidos *</label>
                    <input type="text" id="apellidos" th:field="*{apellidos}" maxlength="80" placeholder="Apellidos completos">
                    <p class="field-error" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></p>
                </div>
                <div class="field">
                    <label for="documento">Documento / DNI *</label>
                    <input type="text" id="documento" th:field="*{documento}" maxlength="20" placeholder="Numero de documento">
                    <p class="field-error" th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}"></p>
                </div>
                <div class="field">
                    <label for="fechaNacimiento">Fecha de nacimiento *</label>
                    <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}">
                    <p class="field-error" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></p>
                </div>
                <div class="field">
                    <label for="sexo">Sexo *</label>
                    <select id="sexo" th:field="*{sexo}">
                        <option value="">Seleccione</option>
                        <option th:each="s : ${T(com.clinica.servicios.domain.enums.Sexo).values()}"
                                th:value="${s}" th:text="${s.etiqueta}"></option>
                    </select>
                    <p class="field-error" th:if="${#fields.hasErrors('sexo')}" th:errors="*{sexo}"></p>
                </div>
                <div class="field">
                    <label for="tipoSangre">Tipo de sangre</label>
                    <select id="tipoSangre" th:field="*{tipoSangre}">
                        <option value="">Seleccione</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2>Contacto</h2>
            <div class="form-grid">
                <div class="field">
                    <label for="telefono">Telefono</label>
                    <input type="text" id="telefono" th:field="*{telefono}" maxlength="20" placeholder="Numero de contacto">
                    <p class="field-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></p>
                </div>
                <div class="field">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" th:field="*{email}" maxlength="120" placeholder="correo@ejemplo.com">
                    <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>
                <div class="field field-full">
                    <label for="direccion">Direccion</label>
                    <input type="text" id="direccion" th:field="*{direccion}" maxlength="200" placeholder="Direccion completa">
                    <p class="field-error" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></p>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2>Informacion clinica</h2>
            <div class="form-grid">
                <div class="field field-full">
                    <label for="alergias">Alergias y observaciones</label>
                    <textarea id="alergias" th:field="*{alergias}" rows="4"
                              placeholder="Alergias medicamentosas, alimentarias u otras observaciones"></textarea>
                    <p class="field-error" th:if="${#fields.hasErrors('alergias')}" th:errors="*{alergias}"></p>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <a th:href="@{/pacientes}" class="btn btn-ghost">Cancelar</a>
            <button type="submit" class="btn btn-primary"
                    th:text="${modoEdicion} ? 'Guardar cambios' : 'Registrar paciente'">Guardar</button>
        </div>
    </form>
</section>
</body>
</html>
