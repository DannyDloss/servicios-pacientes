<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::titulo}, ~{::section})}">
<head>
    <title th:fragment="titulo">Paciente</title>
</head>
<body>
<section>
    <div class="cabecera-pagina">
        <div>
            <h1 th:text="${modoEdicion} ? 'Editar paciente' : 'Nuevo paciente'">Paciente</h1>
            <p class="texto-gris">Complete los datos del paciente.</p>
        </div>
        <div class="acciones">
            <a th:href="@{/pacientes}" class="boton">Volver</a>
        </div>
    </div>

    <form class="formulario"
          th:action="${modoEdicion} ? @{/pacientes/{id}(id=${paciente.id})} : @{/pacientes}"
          th:object="${paciente}" method="post">

        <div class="seccion-form">
            <h2>Datos personales</h2>
            <div class="fila">
                <div class="campo">
                    <label for="nombres">Nombres *</label>
                    <input type="text" id="nombres" th:field="*{nombres}" maxlength="80">
                    <p class="error" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></p>
                </div>
                <div class="campo">
                    <label for="apellidos">Apellidos *</label>
                    <input type="text" id="apellidos" th:field="*{apellidos}" maxlength="80">
                    <p class="error" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></p>
                </div>
                <div class="campo">
                    <label for="documento">Documento *</label>
                    <input type="text" id="documento" th:field="*{documento}" maxlength="20">
                    <p class="error" th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}"></p>
                </div>
                <div class="campo">
                    <label for="fechaNacimiento">Fecha de nacimiento *</label>
                    <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}">
                    <p class="error" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></p>
                </div>
                <div class="campo">
                    <label for="sexo">Sexo *</label>
                    <select id="sexo" th:field="*{sexo}">
                        <option value="">Seleccione</option>
                        <option th:each="s : ${T(com.clinica.servicios.domain.enums.Sexo).values()}"
                                th:value="${s}" th:text="${s.etiqueta}"></option>
                    </select>
                    <p class="error" th:if="${#fields.hasErrors('sexo')}" th:errors="*{sexo}"></p>
                </div>
                <div class="campo">
                    <label for="tipoSangre">Tipo de sangre</label>
                    <input type="text" id="tipoSangre" th:field="*{tipoSangre}" maxlength="10" placeholder="Ej. O+">
                </div>
            </div>
        </div>

        <div class="seccion-form">
            <h2>Contacto</h2>
            <div class="fila">
                <div class="campo">
                    <label for="telefono">Telefono</label>
                    <input type="text" id="telefono" th:field="*{telefono}" maxlength="20">
                    <p class="error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></p>
                </div>
                <div class="campo">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" th:field="*{email}" maxlength="120">
                    <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>
                <div class="campo campo-completo">
                    <label for="direccion">Direccion</label>
                    <input type="text" id="direccion" th:field="*{direccion}" maxlength="200">
                    <p class="error" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></p>
                </div>
                <div class="campo campo-completo">
                    <label for="alergias">Alergias y observaciones</label>
                    <textarea id="alergias" th:field="*{alergias}" rows="3"></textarea>
                    <p class="error" th:if="${#fields.hasErrors('alergias')}" th:errors="*{alergias}"></p>
                </div>
            </div>
        </div>

        <div class="acciones-form">
            <a th:href="@{/pacientes}" class="boton">Cancelar</a>
            <button type="submit" class="boton primario"
                    th:text="${modoEdicion} ? 'Guardar cambios' : 'Registrar paciente'">Guardar</button>
        </div>
    </form>
</section>
</body>
</html>
